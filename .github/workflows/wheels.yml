name: Build wheels

# Adapted from nitime (BSD)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build sdist
        run: pipx run build -s
      - uses: actions/upload-artifact@v7
        with:
          name: source-dist
          path: ./dist/*.tar.gz

  build-wheel:
    name: Build wheel for ${{ matrix.buildplat[1] }}
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      fail-fast: false
      matrix:
        buildplat:
          - [ubuntu-latest, musllinux_x86_64]
          - [ubuntu-latest, manylinux_x86_64]
          - [ubuntu-24.04-arm, manylinux_aarch64]
          - [macos-latest, macosx_arm64]
          - [macos-15-intel, macosx_x86_64]
          - [windows-latest, win_amd64]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build wheel(s)
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD: "cp311-${{ matrix.buildplat[1] }} "

      # cibuildwheel only tests on 3.11; check that the abi3 wheel's compiled modules also load on a newer Python
      - uses: actions/setup-python@v7.0.0
        if: ${{ !startsWith(matrix.buildplat[1], 'musllinux') }}
        with:
          python-version: "3.12"
      - name: Import compiled modules on Python 3.12
        if: ${{ !startsWith(matrix.buildplat[1], 'musllinux') }}
        shell: bash
        run: |
          python -m pip install wheelhouse/*.whl
          cd "$RUNNER_TEMP"
          python -c "
          import importlib, pathlib, eelbrain
          root = pathlib.Path(eelbrain.__file__).parent
          for path in [*root.rglob('*.so'), *root.rglob('*.pyd')]:
              module = '.'.join(['eelbrain', *path.relative_to(root).parent.parts, path.name.split('.')[0]])
              importlib.import_module(module)
              print(f'{module}: {path.name}')
          "

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.buildplat[1] }}-dist
          path: ./wheelhouse/*.whl

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  test-sdist:
    name: Test sdist
    needs: [build-sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: source-dist
          path: ./dist
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install sdist
        run: pip install dist/*.tar.gz
      - name: Install pytest
        run: pip install pytest pingouin
      - name: Run tests
        run: pytest -m "not (slow or gui or file_test)" -rsx -v --pyargs eelbrain

  pre-publish:
    runs-on: ubuntu-latest
    needs: [test-sdist, build-wheel]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: '*-dist'
          merge-multiple: true
      - run: ls -lR dist/
      - run: pipx run twine check dist/*

  publish:
    runs-on: ubuntu-latest
    environment: "Package deployment"
    permissions:
      id-token: write  # for trusted publishing
    needs: [pre-publish]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: '*-dist'
          merge-multiple: true
      - run: ls -lR dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
